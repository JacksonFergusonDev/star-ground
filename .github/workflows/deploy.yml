name: Deploy

on:
  push:
    branches: [ "main" ]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ workflow calls

  # CI can finish for every push. Hold the lock from the check of main's tip
  # through the live site check so deploys cannot interrupt each other.
  production:
    name: Production
    needs: test
    concurrency:
      group: deploy
      queue: max
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/deploy-production.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ workflow calls
