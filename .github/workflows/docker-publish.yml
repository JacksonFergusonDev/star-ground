name: Release

on:
  push:
    tags: [ "v*" ]

permissions: {}

# Releases must not race when updating the floating stable tags.
concurrency:
  group: docker-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require a version tag matching the project
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"Not a release version tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match project version {version}")
          PY

  test:
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ workflow calls

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.candidate.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: container-image-*
          path: ${{ runner.temp }}/images

      - name: Install OCI image tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REGISTRY}/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
          flavor: latest=auto

      - name: Upload exact tested images and attestations
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          for arch in amd64 arm64; do
            artifact="${RUNNER_TEMP}/images/container-image-${arch}"
            expected="$(cat "${artifact}/digest.txt")"
            [[ "$expected" =~ ^sha256:[a-f0-9]{64}$ ]]
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
              --digestfile "${artifact}/uploaded.txt" \
              "oci-archive:${artifact}/image.tar" \
              "docker://${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
            test "$(cat "${artifact}/uploaded.txt")" = "$expected"
          done

      - name: Assemble and verify a release candidate
        id: candidate
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            sources+=("${IMAGE}@$(cat "${RUNNER_TEMP}/images/container-image-${arch}/digest.txt")")
          done
          candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$candidate" "${sources[@]}"
          docker buildx imagetools inspect --raw "$candidate" > "${RUNNER_TEMP}/release-index.json"
          # Require exactly the tested runtime manifests and their attestations.
          for arch in amd64 arm64; do
            skopeo inspect --raw "oci-archive:${RUNNER_TEMP}/images/container-image-${arch}/image.tar" \
              > "${RUNNER_TEMP}/${arch}-index.json"
          done
          jq -s -e '([.[0].manifests[], .[1].manifests[]] | sort_by(.digest)) == (.[2].manifests | sort_by(.digest))' \
            "${RUNNER_TEMP}/amd64-index.json" "${RUNNER_TEMP}/arm64-index.json" "${RUNNER_TEMP}/release-index.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            "${RUNNER_TEMP}/release-index.json"
          digest="sha256:$(sha256sum "${RUNNER_TEMP}/release-index.json" | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign and verify the immutable release candidate
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/docker-publish.yml@${{ github.ref }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${DIGEST}"

      - name: Promote the signed candidate to release tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            test -n "$tag"
            args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            actual="sha256:$(docker buildx imagetools inspect --raw "$tag" | sha256sum | cut -d ' ' -f 1)"
            test "$actual" = "$DIGEST"
          done <<< "$TAGS"
          # Single quotes keep Markdown backticks literal.
          # shellcheck disable=SC2016
          printf 'Published `%s@%s`\n\nBoth native architectures passed container smoke tests. SBOM and provenance are attached.\n' \
            "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # The API runs the exact image just signed, copied into Artifact Registry
  # because Cloud Run can't pull from GHCR. Skipped until the repository's
  # GCP_* variables exist (deploy/README.md sets them up).
  deploy-api:
    name: Deploy the API to Cloud Run
    needs: publish
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SITE: https://star-ground.jacksonferguson.me
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install OCI image tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo

      - name: Copy the signed image to Artifact Registry
        id: copy
        env:
          SOURCE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          registry="${REGION}-docker.pkg.dev"
          target="${registry}/${PROJECT}/star-ground/star-ground"
          gcloud auth print-access-token | \
            skopeo login --username oauth2accesstoken --password-stdin "$registry"
          skopeo copy --all --preserve-digests "docker://${SOURCE}" "docker://${target}:${TAG}"
          echo "image=${target}@${SOURCE#*@}" >> "$GITHUB_OUTPUT"

      # PLAN.md, "Hosting and cost": scale to zero, 2 GiB and 2 vCPU, a new
      # instance past 4 requests, and max instances as the hard cost ceiling.
      # The second-generation environment runs OCR faster (PLAN.md, step 4).
      # Cloud Run serves only the API; GitHub Pages serves the site.
      - name: Deploy
        id: deploy
        env:
          IMAGE: ${{ steps.copy.outputs.image }}
        run: |
          gcloud run deploy star-ground --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" \
            --service-account "star-ground-run@${PROJECT}.iam.gserviceaccount.com" \
            --memory 2Gi --cpu 2 --cpu-boost --execution-environment gen2 \
            --concurrency 4 --min-instances 0 --max-instances 3 \
            --timeout 300 \
            --set-env-vars "STAR_GROUND_TRUST_PROXY=1,STAR_GROUND_SITE_DIR=,STAR_GROUND_CORS_ORIGINS=${SITE}" \
            --quiet
          url="$(gcloud run services describe star-ground --project "$PROJECT" --region "$REGION" \
            --format 'value(status.url)')"
          [[ "$url" =~ ^https://[a-z0-9.-]+$ ]]
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 "${url}/api/health"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          printf 'Deployed `%s` to %s\n' "$IMAGE" "$url" >> "$GITHUB_STEP_SUMMARY"

  # The site goes live after the API it calls, so it never calls routes the
  # running API doesn't have yet.
  deploy-site:
    name: Deploy the site to GitHub Pages
    needs: deploy-api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A release builds from a clean install: no cache a PR could have written.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build against the deployed API
        env:
          PUBLIC_API_URL: ${{ needs.deploy-api.outputs.url }}
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

      - name: Deploy
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
