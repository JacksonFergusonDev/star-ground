name: CI

# Pushes to main run it through deploy.yml, which deploys what passes, and
# version tags through docker-publish.yml.
on:
  workflow_call:
    outputs:
      deploy:
        value: ${{ jobs.changes.outputs.deploy }}
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; every push to a
# branch keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  UV_NO_SYNC: "1"

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      markdown: ${{ steps.select.outputs.markdown }}
      workflows: ${{ steps.select.outputs.workflows }}
      python: ${{ steps.select.outputs.python }}
      web: ${{ steps.select.outputs.web }}
      container: ${{ steps.select.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks from the changed files
        id: select
        env:
          GH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.token || '' }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/changes.sh

  python:
    name: Python and repository checks
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.markdown == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        if: needs.changes.outputs.python == 'true'
        run: uv sync --group ci --no-dev

      - name: Install repository check tools
        if: needs.changes.outputs.python != 'true'
        run: uv sync --only-group ci

      - name: Ruff lint
        if: needs.changes.outputs.python == 'true'
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        if: needs.changes.outputs.python == 'true'
        run: uv run ruff format --check --output-format=github .

      - name: Markdown lint
        if: needs.changes.outputs.markdown == 'true'
        run: uv run rumdl check --output-format github .

      - name: Markdown format
        if: needs.changes.outputs.markdown == 'true'
        run: uv run rumdl fmt --check --output-format github .

      - name: Audit workflows with zizmor
        if: needs.changes.outputs.workflows == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # enables zizmor's online audits
        run: uv run zizmor --format github .github/

      # mypy's cache is incremental, so a stale cache from an older lockfile is
      # still a valid starting point.
      - name: Restore mypy cache
        if: needs.changes.outputs.python == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('.python-version', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ hashFiles('.python-version', 'uv.lock') }}-
            mypy-

      - name: Type check with mypy
        if: needs.changes.outputs.python == 'true'
        run: uv run mypy

      # The corpus's PDFs belong to their publishers, so they're downloaded,
      # once per manifest change, instead of kept in the repository.
      - name: Restore test samples
        if: needs.changes.outputs.python == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/samples/**/*.pdf
          key: samples-${{ hashFiles('tests/samples/manifest.json') }}

      - name: Fetch test samples
        if: needs.changes.outputs.python == 'true'
        run: uv run python -m scripts.fetch_samples

      - name: Test with pytest
        if: needs.changes.outputs.python == 'true'
        run: uv run pytest -n auto

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      playwright-image: ${{ steps.playwright-image.outputs.image }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Unused files, exports, and dependencies
        run: pnpm run knip

      # The API's types are generated from openapi.json; they must match it.
      - name: Check API types are current
        run: |
          pnpm run types
          git diff --exit-code -- src/lib/api

      - name: Type check
        run: pnpm run check

      # The browser tests check the catalog pages against fixed entries, not
      # the nightly catalog. The real catalog is still checked by the schema
      # in a release's build.
      - name: Build
        env:
          CATALOG_DIR: tests/fixtures/catalog
        run: pnpm run build

      # The browser tests run in Playwright's image for the locked version, with
      # browsers and system packages preinstalled: installing them here with apt
      # once hung until the job timed out.
      - name: Resolve the locked Playwright image
        id: playwright-image
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          tag="v${version}-noble"
          digest=$(curl --fail --silent --show-error --retry 3 --max-time 30 --head \
            --header 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            --output /dev/null --write-out '%header{docker-content-digest}' \
            "https://mcr.microsoft.com/v2/playwright/manifests/${tag}")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::No valid Playwright image digest found for ${tag}"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:${tag}@${digest}" >> "$GITHUB_OUTPUT"

      # The browser tests check this exact build.
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  web-browsers:
    name: Web browsers (${{ matrix.shard }}/3)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ${{ needs.web.outputs.playwright-image }} # zizmor: ignore[unpinned-images] -- the Web job pins it to a validated sha256 digest
      options: --init --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist

      # GitHub mounts the home directory with an owner Firefox rejects.
      - name: Prepare Firefox's home directory
        run: chown "$(id -u):$(id -g)" "$HOME"

      # Firefox on Linux creates a WebGL context only with an X display, so a
      # virtual one lets the hero board render in every engine (in software).
      - name: Browser tests
        env:
          SHARD: ${{ matrix.shard }}
        run: xvfb-run --auto-servernum pnpm run test:browser --shard="$SHARD/3"

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7

  container:
    name: Container
    needs: changes
    if: needs.changes.outputs.container == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/container-test.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ workflow calls
    with:
      keep-image: ${{ github.ref_type == 'tag' || needs.changes.outputs.deploy == 'true' }}

  # The single required status check: add new jobs to `needs`, not to the ruleset.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, python, web, web-browsers, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the selected jobs to pass
        env:
          SELECTION: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$SELECTION" != "success" ]; then
            echo "::error::Could not select checks ($SELECTION)."
            exit 1
          fi
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A selected job finished with $r."
              exit 1
            fi
          done
