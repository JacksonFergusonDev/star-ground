name: CI

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; every push to a
# branch keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  UV_NO_SYNC: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --only-group ci

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check --output-format=github .

      - name: Markdown lint
        run: uv run rumdl check --output-format github .

      - name: Markdown format
        run: uv run rumdl fmt --check --output-format github .

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }} # enables zizmor's online audits
        run: uv run zizmor --format github .github/

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --group ci --no-dev

      # mypy's cache is incremental, so a stale cache from an older lockfile is
      # still a valid starting point.
      - name: Restore mypy cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('.python-version', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ hashFiles('.python-version', 'uv.lock') }}-
            mypy-

      - name: Type check with mypy
        run: uv run mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --group ci --no-dev

      # The corpus's PDFs belong to their publishers, so they're downloaded,
      # once per manifest change, instead of kept in the repository.
      - name: Restore test samples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/samples/**/*.pdf
          key: samples-${{ hashFiles('tests/samples/manifest.json') }}

      - name: Fetch test samples
        run: uv run python -m tools.fetch_samples

      - name: Test with pytest
        run: uv run pytest -n auto

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      playwright-image: ${{ steps.playwright-image.outputs.image }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unused files, exports, and dependencies
        run: npm run knip

      # The API's types are generated from openapi.json; they must match it.
      - name: Check API types are current
        run: |
          npm run types
          git diff --exit-code -- src/lib/api

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # The browser tests run in Playwright's image for the locked version, with
      # browsers and system packages preinstalled: installing them here with apt
      # once hung until the job timed out.
      - name: Resolve the locked Playwright image
        id: playwright-image
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          tag="v${version}-noble"
          digest=$(curl --fail --silent --show-error --retry 3 --max-time 30 --head \
            --header 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            --output /dev/null --write-out '%header{docker-content-digest}' \
            "https://mcr.microsoft.com/v2/playwright/manifests/${tag}")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::No valid Playwright image digest found for ${tag}"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:${tag}@${digest}" >> "$GITHUB_OUTPUT"

      # The browser tests check this exact build.
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  web-browsers:
    name: Web browsers (${{ matrix.shard }}/3)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ${{ needs.web.outputs.playwright-image }} # zizmor: ignore[unpinned-images] -- the Web job pins it to a validated sha256 digest
      options: --init --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist

      # GitHub mounts the home directory with an owner Firefox rejects.
      - name: Prepare Firefox's home directory
        run: chown "$(id -u):$(id -g)" "$HOME"

      # Firefox on Linux creates a WebGL context only with an X display, so a
      # virtual one lets the hero board render in every engine (in software).
      - name: Browser tests
        env:
          SHARD: ${{ matrix.shard }}
        run: xvfb-run --auto-servernum npm run test:browser -- --shard="$SHARD/3"

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7

  container:
    name: Container
    permissions:
      contents: read
    uses: ./.github/workflows/container-test.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ workflow calls

  # The single required status check: add new jobs to `needs`, not to the ruleset.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, typecheck, test, web, web-browsers, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job finished with: $r"
              exit 1
            fi
          done
