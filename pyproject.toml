[project]
name = "star-ground"
version = "2.3.0"
description = "Logistics engine for analog electronics"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.14"
dependencies = [
    "fpdf2==2.8.7",
    "google-auth==2.56.3",
    "gspread==6.2.1",
    "pdfplumber==0.11.10",
    "pint>=0.25.3",
    "requests==2.34.2",
    "streamlit==1.61.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "prek>=0.4.14",
    "watchdog==6.0.0",
    { include-group = "ci" },
]

ci = [
    "hypothesis==6.165.2",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.1",
    "rumdl>=0.2.62",
    { include-group = "type-stubs" },
]

type-stubs = [
    "pandas-stubs",
    "types-cachetools",
    "types-cffi",
    "types-colorama",
    "types-defusedxml",
    "types-fpdf2",
    "types-jsonschema",
    "types-pexpect",
    "types-protobuf",
    "types-pyasn1",
    "types-pycurl",
    "types-pygments",
    "types-requests",
    "types-toml",
]

# ==================================================
# Tool Configuration
# ==================================================

# ---- ruff ---- #

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = ["D100", "D104", "D107", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["star-ground"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D"]

# ---- mypy ---- #

[tool.mypy]
mypy_path = "."
python_version = "3.14"
strict=true
pretty = true
show_error_codes = true
show_error_context = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false

# ---- pytest ---- #

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/"]
branch = true

[tool.coverage.report]
omit = ["src/**/__init__.py"]
show_missing = true
skip_covered = true

# ---- rumdl  ---- #

[tool.rumdl]
# Disabled globally
disable = [
    "MD013", # line length – soft‑wrap instead
    "MD033", # inline HTML – needed for <details>, custom layouts
]

# Enforced with custom options
[tool.rumdl.MD003]
style = "atx"          # # headings only

[tool.rumdl.MD004]
style = "dash"         # - lists (cleaner than * or +)

[tool.rumdl.MD009]
br-spaces = 2          # allow 2 spaces for hard line breaks
strict = false         # flag only stray trailing spaces

[tool.rumdl.MD024]
siblings-only = true   # allow duplicate headings under different parents

[tool.rumdl.MD029]
style = "one"          # all list items numbered 1. – reduces diff noise
