default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages:
  - pre-commit

fail_fast: true

repos:
  # Generic hooks (configured to IGNORE Python)
  - repo: builtin
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
        exclude: \.py$
      - id: end-of-file-fixer
        exclude: \.py$
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # Local Python Toolchain (Managed via uv.lock)
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      # Checks the files listed in pyproject.toml, as CI does, rather than only
      # the staged ones; the incremental cache keeps it quick.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: rumdl-check
        name: rumdl check
        entry: uv run rumdl check --fix
        language: system
        types: [markdown]
        require_serial: true

      - id: rumdl-fmt
        name: rumdl fmt
        entry: uv run rumdl fmt
        language: system
        types: [markdown]
        require_serial: true

      - id: zizmor
        name: zizmor
        entry: uv run zizmor --offline .github/
        language: system
        pass_filenames: false
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*)$

      - id: pytest
        name: pytest
        entry: uv run just test
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Website (web/), mirroring CI's Web job. Hooks run from the repository root,
  # so each one moves into web/ and drops the web/ prefix from the file names.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd web && npx prettier --write --ignore-unknown "${@#web/}"' --
        language: system
        files: ^web/
        require_serial: true

      - id: eslint
        name: eslint
        entry: bash -c 'cd web && npx eslint "${@#web/}"' --
        language: system
        files: ^web/.*\.(astro|svelte|[cm]?[jt]s)$
        require_serial: true

      - id: stylelint
        name: stylelint
        entry: bash -c 'cd web && npx stylelint "${@#web/}"' --
        language: system
        files: ^web/src/.*\.(astro|svelte|css)$
        require_serial: true

      - id: api-types
        name: API types match openapi.json
        entry: bash -c 'cd web && npm run --silent types && git diff --exit-code -- src/lib/api'
        language: system
        files: ^(openapi\.json|web/(openapi-ts\.config\.ts|package-lock\.json|src/lib/api/))
        pass_filenames: false

      - id: astro-check
        name: astro check
        entry: bash -c 'cd web && npm run --silent check'
        language: system
        files: ^web/(src/|tsconfig\.json|astro\.config\.mjs|svelte\.config\.js|package-lock\.json)
        pass_filenames: false

      - id: knip
        name: knip (unused files, exports, and dependencies)
        entry: bash -c 'cd web && npm run --silent knip'
        language: system
        files: ^web/
        pass_filenames: false
        stages: [pre-push]

      # The browser tests serve the build, so it runs first, with the fixed
      # catalog entries they test against rather than the nightly catalog.
      - id: astro-build
        name: astro build
        entry: bash -c 'cd web && CATALOG_DIR=tests/fixtures/catalog npm run --silent build'
        language: system
        files: ^(web/|openapi\.json)
        pass_filenames: false
        stages: [pre-push]

      - id: browser-tests
        name: browser tests
        entry: bash -c 'cd web && npm run --silent test:browser'
        language: system
        files: ^(web/|openapi\.json)
        pass_filenames: false
        stages: [pre-push]

  # Check for accidental commits of secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Commit message validation
  - repo: https://github.com/Goldziher/gitfluff
    rev: v0.8.0
    hooks:
      - id: gitfluff-lint
        args: [--write]
        stages: [commit-msg]

  # Renovate config validation
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.51.0
    hooks:
      - id: renovate-config-validator
        files: '.github/renovate.json'

  # GitHub Actions workflow validation
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
